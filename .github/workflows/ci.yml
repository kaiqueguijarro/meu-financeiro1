name: Verificar Meu Financeiro

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar aplicação
        run: npm run build
      - name: Compilar regras de previsão para testes
        run: npx tsc src/forecast.ts --target es2022 --module nodenext --moduleResolution nodenext --outDir .test-build --skipLibCheck
      - name: Testar cálculos financeiros
        run: node tests/forecast.test.mjs
